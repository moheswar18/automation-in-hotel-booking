<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StayEase | Luxury Hotels & Automated Infrastructure</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for runtime JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = window.location.origin.includes('5000') 
      ? '/api' 
      : 'http://localhost:5000/api';

    function App() {
      const [view, setView] = useState('home'); // home, hotels, hotel-details, booking, payment, confirm, my-bookings, admin, login, register
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('stayease_token'));
      const [hotels, setHotels] = useState([]);
      const [selectedHotel, setSelectedHotel] = useState(null);
      const [selectedRoom, setSelectedRoom] = useState(null);
      const [currentBooking, setCurrentBooking] = useState(null);
      const [myBookings, setMyBookings] = useState([]);
      const [adminStats, setAdminStats] = useState(null);
      const [adminCharts, setAdminCharts] = useState(null);
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Search & filter state
      const [searchLocation, setSearchLocation] = useState('');
      const [searchCheckIn, setSearchCheckIn] = useState('2026-10-15');
      const [searchCheckOut, setSearchCheckOut] = useState('2026-10-18');
      const [searchGuests, setSearchGuests] = useState(2);
      const [sortOrder, setSortOrder] = useState('rating_desc');
      const [filterMaxPrice, setFilterMaxPrice] = useState(30000);

      // Auth inputs
      const [loginEmail, setLoginEmail] = useState('admin@stayease.com');
      const [loginPass, setLoginPass] = useState('Admin@123');
      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPhone, setRegPhone] = useState('');
      const [regPass, setRegPass] = useState('');

      const showToast = (msg, type='success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Load initial user
      useEffect(() => {
        const savedUser = localStorage.getItem('stayease_user');
        if (savedUser) {
          try { setUser(JSON.parse(savedUser)); } catch(e){}
        }
        loadHotels();
      }, []);

      const loadHotels = async () => {
        try {
          const res = await fetch(`${API_BASE}/hotels?sort_by=${sortOrder}`);
          const data = await res.json();
          if (data.hotels) setHotels(data.hotels);
        } catch(err) {
          console.warn('API fetch failed, check backend server:', err);
        }
      };

      const loadMyBookings = async () => {
        if (!token) return;
        try {
          const res = await fetch(`${API_BASE}/bookings`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.bookings) setMyBookings(data.bookings);
        } catch(e){}
      };

      const loadAdminDashboard = async () => {
        if (!token) return;
        try {
          const res = await fetch(`${API_BASE}/admin/dashboard`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.statistics) {
            setAdminStats(data.statistics);
            setAdminCharts(data.charts);
          }
        } catch(e){}
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: loginEmail, password: loginPass })
          });
          const data = await res.json();
          if (data.success && data.token) {
            setToken(data.token);
            setUser(data.user);
            localStorage.setItem('stayease_token', data.token);
            localStorage.setItem('stayease_user', JSON.stringify(data.user));
            showToast(`Welcome back, ${data.user.name}!`);
            setView(data.user.role === 'admin' ? 'admin' : 'hotels');
          } else {
            showToast(data.message || 'Login failed', 'error');
          }
        } catch(e) {
          showToast('Connection failed. Ensure backend is running.', 'error');
        } finally {
          setLoading(false);
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: regName,
              email: regEmail,
              phone: regPhone,
              password: regPass,
              confirm_password: regPass
            })
          });
          const data = await res.json();
          if (data.success) {
            setToken(data.token);
            setUser(data.user);
            localStorage.setItem('stayease_token', data.token);
            localStorage.setItem('stayease_user', JSON.stringify(data.user));
            showToast('Account created successfully!');
            setView('hotels');
          } else {
            showToast(data.message || 'Registration failed', 'error');
          }
        } catch(e) {
          showToast('Registration failed: ' + e.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      const handleLogout = () => {
        setToken(null);
        setUser(null);
        localStorage.removeItem('stayease_token');
        localStorage.removeItem('stayease_user');
        showToast('Logged out successfully.');
        setView('home');
      };

      const handleOpenHotel = async (hotelId) => {
        try {
          const res = await fetch(`${API_BASE}/hotels/${hotelId}`);
          const data = await res.json();
          if (data.hotel) {
            setSelectedHotel(data.hotel);
            setView('hotel-details');
          }
        } catch(e){}
      };

      const handleSelectRoom = (room) => {
        if (!user) {
          showToast('Please sign in to proceed with booking', 'error');
          setView('login');
          return;
        }
        setSelectedRoom(room);
        setView('booking');
      };

      const handleConfirmBooking = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/bookings`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              hotel_id: selectedHotel.id,
              room_id: selectedRoom.id,
              check_in: searchCheckIn,
              check_out: searchCheckOut,
              guests: parseInt(searchGuests),
              guest_name: user.name,
              guest_email: user.email,
              guest_phone: user.phone || '+91 9876543210'
            })
          });
          const data = await res.json();
          if (data.success && data.booking) {
            setCurrentBooking(data.booking);
            setView('payment');
          } else {
            showToast(data.message || 'Booking creation failed', 'error');
          }
        } catch(e) {
          showToast('Booking failed: ' + e.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      const handleSimulatePayment = async (method) => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/payments`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              booking_id: currentBooking.id,
              payment_method: method
            })
          });
          const data = await res.json();
          if (data.success) {
            setCurrentBooking(data.booking);
            showToast('Booking Confirmed Successfully!');
            setView('confirm');
          } else {
            showToast('Payment simulation failed', 'error');
          }
        } catch(e) {
          showToast('Payment processing error', 'error');
        } finally {
          setLoading(false);
        }
      };

      const handleCancelBooking = async (id, bookingCode) => {
        if (!confirm(`Cancel reservation ${bookingCode}?`)) return;
        try {
          const res = await fetch(`${API_BASE}/bookings/${id}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ status: 'cancelled' })
          });
          const data = await res.json();
          if (data.success) {
            showToast(`Booking ${bookingCode} cancelled.`);
            loadMyBookings();
          }
        } catch(e){}
      };

      // Filtered hotels
      const filteredHotels = hotels.filter(h => {
        const matchesLoc = searchLocation ? h.location.toLowerCase().includes(searchLocation.toLowerCase()) || h.name.toLowerCase().includes(searchLocation.toLowerCase()) : true;
        const matchesPrice = (h.starting_price || 0) <= filterMaxPrice;
        return matchesLoc && matchesPrice;
      });

      return (
        <div className="flex flex-col min-h-screen">
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-5 py-3 rounded-2xl shadow-xl text-xs font-bold text-white transition duration-300 ${
              toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'
            }`}>
              {toast.msg}
            </div>
          )}

          {/* NAVBAR */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
              <div onClick={() => setView('home')} className="flex items-center space-x-3 cursor-pointer">
                <div className="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black text-lg shadow-md shadow-blue-500/20">
                  SE
                </div>
                <div>
                  <span className="text-2xl font-black tracking-tight text-slate-900">
                    Stay<span className="text-blue-600">Ease</span>
                  </span>
                  <span className="block text-[10px] font-semibold text-slate-400 uppercase -mt-1 tracking-wider">
                    Infrastructure Automation
                  </span>
                </div>
              </div>

              <nav className="hidden md:flex items-center space-x-2">
                <button onClick={() => setView('home')} className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${view === 'home' ? 'text-blue-600 bg-blue-50' : 'text-slate-600 hover:text-slate-900'}`}>Home</button>
                <button onClick={() => setView('hotels')} className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${view === 'hotels' ? 'text-blue-600 bg-blue-50' : 'text-slate-600 hover:text-slate-900'}`}>Hotels</button>
                {user && (
                  <button onClick={() => { loadMyBookings(); setView('my-bookings'); }} className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${view === 'my-bookings' ? 'text-blue-600 bg-blue-50' : 'text-slate-600 hover:text-slate-900'}`}>My Bookings</button>
                )}
                {user?.role === 'admin' && (
                  <button onClick={() => { loadAdminDashboard(); setView('admin'); }} className={`px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-1.5 ${view === 'admin' ? 'bg-amber-100 text-amber-900' : 'text-amber-700 bg-amber-50 hover:bg-amber-100'}`}>
                    <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                    Admin Dashboard
                  </button>
                )}
              </nav>

              <div className="flex items-center space-x-3">
                {user ? (
                  <div className="flex items-center space-x-3">
                    <span className="text-xs font-bold text-slate-700 hidden sm:inline">{user.name} ({user.role})</span>
                    <button onClick={handleLogout} className="px-3.5 py-1.5 border border-slate-300 text-slate-700 hover:text-red-600 hover:border-red-300 rounded-lg text-xs font-bold transition">Logout</button>
                  </div>
                ) : (
                  <div className="flex items-center space-x-2">
                    <button onClick={() => setView('login')} className="px-4 py-2 text-xs font-bold text-slate-700 hover:text-blue-600">Sign In</button>
                    <button onClick={() => setView('register')} className="px-4 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm">Register</button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1">
            {/* VIEW 1: HOME */}
            {view === 'home' && (
              <div>
                <section className="relative bg-slate-900 text-white pt-20 pb-28 px-4 overflow-hidden text-center">
                  <div className="max-w-4xl mx-auto space-y-5">
                    <span className="inline-block px-3.5 py-1 bg-blue-500/20 text-blue-300 rounded-full text-xs font-bold uppercase tracking-wider border border-blue-400/30">
                      Cloud-Native High-Availability Hotel Platform
                    </span>
                    <h1 className="text-4xl sm:text-6xl font-black tracking-tight">
                      Find Your <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">Perfect Stay</span>
                    </h1>
                    <p className="text-slate-300 max-w-xl mx-auto text-base sm:text-lg">
                      Search, compare and book comfortable hotels with ease.
                    </p>

                    {/* Search bar */}
                    <div className="mt-8 bg-white text-slate-900 rounded-3xl p-4 shadow-2xl max-w-3xl mx-auto grid grid-cols-1 sm:grid-cols-4 gap-3 text-left">
                      <div className="p-2 bg-slate-50 rounded-xl border border-slate-200">
                        <label className="text-[10px] font-bold text-slate-400 uppercase block">Location</label>
                        <input
                          type="text"
                          placeholder="Goa, Mumbai, Jaipur..."
                          value={searchLocation}
                          onChange={e => setSearchLocation(e.target.value)}
                          className="w-full bg-transparent text-xs font-bold focus:outline-none"
                        />
                      </div>
                      <div className="p-2 bg-slate-50 rounded-xl border border-slate-200">
                        <label className="text-[10px] font-bold text-slate-400 uppercase block">Check-in</label>
                        <input
                          type="date"
                          value={searchCheckIn}
                          onChange={e => setSearchCheckIn(e.target.value)}
                          className="w-full bg-transparent text-xs font-bold focus:outline-none"
                        />
                      </div>
                      <div className="p-2 bg-slate-50 rounded-xl border border-slate-200">
                        <label className="text-[10px] font-bold text-slate-400 uppercase block">Check-out</label>
                        <input
                          type="date"
                          value={searchCheckOut}
                          onChange={e => setSearchCheckOut(e.target.value)}
                          className="w-full bg-transparent text-xs font-bold focus:outline-none"
                        />
                      </div>
                      <button
                        onClick={() => setView('hotels')}
                        className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-blue-500/30"
                      >
                        Search Hotels
                      </button>
                    </div>
                  </div>
                </section>

                {/* Destinations */}
                <section className="max-w-7xl mx-auto px-4 py-12">
                  <h2 className="text-2xl font-black text-slate-900 mb-6">Popular Destinations</h2>
                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
                    {['Goa', 'Mumbai', 'Jaipur', 'Manali', 'Bangalore', 'Udaipur'].map(city => (
                      <div
                        key={city}
                        onClick={() => { setSearchLocation(city); setView('hotels'); }}
                        className="p-4 bg-white border border-slate-200 rounded-2xl text-center cursor-pointer hover:border-blue-500 hover:shadow-md transition"
                      >
                        <span className="text-2xl block mb-1">📍</span>
                        <span className="font-bold text-sm text-slate-800">{city}</span>
                      </div>
                    ))}
                  </div>
                </section>

                {/* Featured Stays */}
                <section className="max-w-7xl mx-auto px-4 pb-16">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-2xl font-black text-slate-900">Featured Hotels</h2>
                    <button onClick={() => setView('hotels')} className="text-xs font-bold text-blue-600 hover:underline">View All Hotels →</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    {hotels.slice(0, 4).map(h => (
                      <div key={h.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col">
                        <img src={h.image} className="h-44 w-full object-cover" />
                        <div className="p-4 flex-1 flex flex-col justify-between space-y-3">
                          <div>
                            <div className="flex justify-between text-xs font-bold mb-1">
                              <span className="text-blue-600">{h.location}</span>
                              <span className="text-amber-500">★ {h.rating}</span>
                            </div>
                            <h3 className="font-bold text-sm text-slate-900">{h.name}</h3>
                          </div>
                          <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                            <span className="text-sm font-black text-slate-900">₹{Number(h.starting_price).toLocaleString('en-IN')}<span className="text-[10px] text-slate-400 font-normal"> /night</span></span>
                            <button onClick={() => handleOpenHotel(h.id)} className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold">Details</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}

            {/* VIEW 2: HOTELS LISTING */}
            {view === 'hotels' && (
              <div className="max-w-7xl mx-auto px-4 py-8">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                  <div>
                    <h1 className="text-2xl font-black text-slate-900">Available Hotels</h1>
                    <p className="text-xs text-slate-500">Showing {filteredHotels.length} verified stays</p>
                  </div>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="Filter by city..."
                      value={searchLocation}
                      onChange={e => setSearchLocation(e.target.value)}
                      className="px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold"
                    />
                    <select
                      value={sortOrder}
                      onChange={e => { setSortOrder(e.target.value); loadHotels(); }}
                      className="px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold"
                    >
                      <option value="rating_desc">Highest Rated</option>
                      <option value="price_asc">Price: Low to High</option>
                      <option value="price_desc">Price: High to Low</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredHotels.map(h => (
                    <div key={h.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col">
                      <div className="relative h-48">
                        <img src={h.image} className="w-full h-full object-cover" />
                        <span className="absolute top-3 left-3 px-2.5 py-1 bg-white/90 backdrop-blur rounded-full text-[11px] font-bold text-slate-800">📍 {h.location}</span>
                        <span className="absolute top-3 right-3 px-2.5 py-1 bg-amber-400 rounded-full text-[11px] font-black text-slate-900">★ {h.rating}</span>
                      </div>
                      <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
                        <div>
                          <h3 className="font-bold text-base text-slate-900 mb-1">{h.name}</h3>
                          <p className="text-xs text-slate-500 line-clamp-2">{h.description}</p>
                        </div>
                        <div className="flex justify-between items-center pt-3 border-t border-slate-100">
                          <div>
                            <span className="text-[10px] text-slate-400 block">Starting from</span>
                            <span className="text-base font-black text-slate-900">₹{Number(h.starting_price).toLocaleString('en-IN')}</span>
                          </div>
                          <button onClick={() => handleOpenHotel(h.id)} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-sm">View Rooms</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 3: HOTEL DETAILS */}
            {view === 'hotel-details' && selectedHotel && (
              <div className="max-w-5xl mx-auto px-4 py-8 space-y-8">
                <button onClick={() => setView('hotels')} className="text-xs font-bold text-blue-600 flex items-center gap-1">← Back to Hotels</button>
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 border-b pb-4">
                  <div>
                    <span className="text-xs font-bold text-blue-600 uppercase">{selectedHotel.location}</span>
                    <h1 className="text-3xl font-black text-slate-900 mt-1">{selectedHotel.name}</h1>
                    <p className="text-xs text-slate-500">{selectedHotel.address}</p>
                  </div>
                  <div className="text-right">
                    <span className="text-2xl font-black text-blue-600">★ {selectedHotel.rating}</span>
                  </div>
                </div>

                <img src={selectedHotel.image} className="w-full h-80 object-cover rounded-3xl shadow-sm" />

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="md:col-span-2 space-y-4">
                    <h3 className="text-base font-bold text-slate-900">About Property</h3>
                    <p className="text-xs text-slate-600 leading-relaxed">{selectedHotel.description}</p>
                    <h3 className="text-base font-bold text-slate-900 pt-2">Facilities</h3>
                    <div className="flex flex-wrap gap-2">
                      {(selectedHotel.facilities || []).map((f, i) => (
                        <span key={i} className="px-3 py-1 bg-slate-100 rounded-lg text-xs font-medium text-slate-700">{f}</span>
                      ))}
                    </div>
                  </div>
                  <div className="p-5 bg-slate-50 border border-slate-200 rounded-2xl space-y-3 h-fit text-xs text-slate-600">
                    <h4 className="font-bold text-slate-900">Stay Highlights</h4>
                    <p>✓ Instant confirmation</p>
                    <p>✓ Free Wi-Fi across premises</p>
                    <p>✓ 24/7 Reception & Concierge</p>
                  </div>
                </div>

                {/* Available Rooms */}
                <div className="space-y-4 pt-4">
                  <h2 className="text-2xl font-black text-slate-900">Select a Room</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {(selectedHotel.rooms || []).map(r => (
                      <div key={r.id} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <img src={r.image} className="w-full h-36 object-cover rounded-xl" />
                        <div>
                          <h4 className="font-bold text-sm text-slate-900">{r.room_type}</h4>
                          <p className="text-xs text-blue-600 font-medium">{r.bed_type} • {r.capacity} Guests</p>
                        </div>
                        <div className="flex justify-between items-center pt-2 border-t">
                          <span className="text-sm font-black text-slate-900">₹{Number(r.price).toLocaleString('en-IN')}<span className="text-[10px] text-slate-400 font-normal"> /night</span></span>
                          <button onClick={() => handleSelectRoom(r)} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold">Book Now</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 4: BOOKING FORM */}
            {view === 'booking' && selectedHotel && selectedRoom && (
              <div className="max-w-2xl mx-auto px-4 py-8">
                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6">
                  <div>
                    <span className="text-xs font-bold text-blue-600 uppercase">Reservation Checkout</span>
                    <h1 className="text-2xl font-black text-slate-900 mt-1">Review & Confirm Booking</h1>
                  </div>

                  <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2 text-xs">
                    <div className="flex justify-between"><span>Hotel:</span><strong className="text-slate-900">{selectedHotel.name}</strong></div>
                    <div className="flex justify-between"><span>Room:</span><strong className="text-slate-900">{selectedRoom.room_type}</strong></div>
                    <div className="flex justify-between"><span>Rate:</span><strong>₹{Number(selectedRoom.price).toLocaleString('en-IN')} /night</strong></div>
                  </div>

                  <form onSubmit={handleConfirmBooking} className="space-y-4 text-xs">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="font-bold block mb-1">Check-in Date</label>
                        <input type="date" value={searchCheckIn} onChange={e => setSearchCheckIn(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl" required />
                      </div>
                      <div>
                        <label className="font-bold block mb-1">Check-out Date</label>
                        <input type="date" value={searchCheckOut} onChange={e => setSearchCheckOut(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl" required />
                      </div>
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Guests</label>
                      <input type="number" min="1" max={selectedRoom.capacity} value={searchGuests} onChange={e => setSearchGuests(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl" required />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Guest Name</label>
                      <input type="text" defaultValue={user?.name} className="w-full p-2.5 bg-slate-50 border rounded-xl" required />
                    </div>
                    <button type="submit" disabled={loading} className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-md text-sm">
                      {loading ? 'Creating...' : 'Proceed to Simulated Payment'}
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* VIEW 5: PAYMENT SIMULATION */}
            {view === 'payment' && currentBooking && (
              <div className="max-w-xl mx-auto px-4 py-8">
                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6 text-center">
                  <span className="text-3xl">💳</span>
                  <h1 className="text-2xl font-black text-slate-900">Simulated Payment Gateway</h1>
                  <p className="text-xs text-amber-700 bg-amber-50 p-2 rounded-xl border border-amber-200 font-semibold">
                    Academic Project Demo: No real charges applied.
                  </p>
                  <div className="p-4 bg-slate-50 rounded-2xl border text-xs text-left space-y-2">
                    <div className="flex justify-between"><span>Booking Reference:</span><strong className="font-mono text-blue-600">{currentBooking.booking_id}</strong></div>
                    <div className="flex justify-between"><span>Total Amount:</span><strong className="text-base text-emerald-600 font-black">₹{Number(currentBooking.total_amount).toLocaleString('en-IN')}</strong></div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <button onClick={() => handleSimulatePayment('card')} className="p-3 border border-slate-200 hover:border-blue-500 rounded-xl text-xs font-bold">💳 Card</button>
                    <button onClick={() => handleSimulatePayment('upi')} className="p-3 border border-slate-200 hover:border-blue-500 rounded-xl text-xs font-bold">📱 UPI</button>
                    <button onClick={() => handleSimulatePayment('netbanking')} className="p-3 border border-slate-200 hover:border-blue-500 rounded-xl text-xs font-bold">🏦 Net Banking</button>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 6: CONFIRMATION */}
            {view === 'confirm' && currentBooking && (
              <div className="max-w-xl mx-auto px-4 py-8">
                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6 text-center">
                  <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto font-black">✓</div>
                  <h1 className="text-2xl font-black text-slate-900">Booking Confirmed Successfully!</h1>
                  <div className="p-4 bg-slate-50 rounded-2xl border text-xs text-left space-y-2">
                    <div className="flex justify-between"><span>Booking ID:</span><strong className="font-mono text-blue-600">{currentBooking.booking_id}</strong></div>
                    <div className="flex justify-between"><span>Hotel:</span><strong>{currentBooking.hotel_name}</strong></div>
                    <div className="flex justify-between"><span>Room:</span><strong>{currentBooking.room_type}</strong></div>
                    <div className="flex justify-between"><span>Dates:</span><strong>{currentBooking.check_in} → {currentBooking.check_out}</strong></div>
                    <div className="flex justify-between"><span>Status:</span><span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-bold">Confirmed</span></div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => { loadMyBookings(); setView('my-bookings'); }} className="flex-1 py-3 bg-blue-600 text-white rounded-xl text-xs font-bold">View My Bookings</button>
                    <button onClick={() => setView('hotels')} className="flex-1 py-3 border border-slate-300 text-slate-700 rounded-xl text-xs font-bold">Back to Hotels</button>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 7: MY BOOKINGS */}
            {view === 'my-bookings' && (
              <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
                <h1 className="text-2xl font-black text-slate-900">My Reservations</h1>
                {myBookings.length === 0 ? (
                  <div className="p-12 text-center bg-white rounded-2xl border border-slate-200 text-xs text-slate-500">
                    No bookings found. <button onClick={() => setView('hotels')} className="text-blue-600 font-bold hover:underline">Find a Hotel</button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {myBookings.map(b => (
                      <div key={b.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                          <div className="flex items-center gap-2 mb-1">
                            <span className="font-mono text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{b.booking_id}</span>
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              b.status === 'confirmed' ? 'bg-emerald-100 text-emerald-800' :
                              b.status === 'completed' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800'
                            }`}>{b.status}</span>
                          </div>
                          <h3 className="font-bold text-sm text-slate-900">{b.hotel_name}</h3>
                          <p className="text-xs text-slate-500">{b.room_type} • {b.check_in} to {b.check_out}</p>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="text-base font-black text-slate-900">₹{Number(b.total_amount).toLocaleString('en-IN')}</span>
                          {b.status === 'confirmed' && (
                            <button onClick={() => handleCancelBooking(b.id, b.booking_id)} className="px-3 py-1.5 border border-red-200 text-red-600 rounded-lg text-xs font-bold hover:bg-red-50">Cancel</button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* VIEW 8: ADMIN DASHBOARD */}
            {view === 'admin' && (
              <div className="max-w-6xl mx-auto px-4 py-8 space-y-6">
                <div className="flex justify-between items-center bg-white p-6 rounded-3xl border border-slate-200">
                  <div>
                    <span className="text-xs font-bold text-amber-600 uppercase">Administrator Portal</span>
                    <h1 className="text-2xl font-black text-slate-900">Infrastructure & Booking Analytics</h1>
                  </div>
                  <div className="flex gap-2">
                    <a href="http://localhost:3001" target="_blank" className="px-3 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-bold">Grafana</a>
                    <a href="http://localhost:9090" target="_blank" className="px-3 py-1.5 bg-amber-600 text-white rounded-lg text-xs font-bold">Prometheus</a>
                  </div>
                </div>

                {/* KPI stats */}
                <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
                  {[
                    { label: 'Users', val: adminStats?.total_users || 3, col: 'text-blue-600' },
                    { label: 'Hotels', val: adminStats?.total_hotels || 8, col: 'text-purple-600' },
                    { label: 'Rooms', val: adminStats?.total_rooms || 17, col: 'text-indigo-600' },
                    { label: 'Bookings', val: adminStats?.total_bookings || 4, col: 'text-cyan-600' },
                    { label: 'Confirmed', val: adminStats?.confirmed_bookings || 2, col: 'text-emerald-600' },
                    { label: 'Cancelled', val: adminStats?.cancelled_bookings || 1, col: 'text-red-600' },
                    { label: 'Revenue', val: `₹${Number(adminStats?.total_revenue || 58128).toLocaleString('en-IN')}`, col: 'text-emerald-600' },
                  ].map((k, idx) => (
                    <div key={idx} className="bg-white p-4 rounded-2xl border border-slate-200">
                      <span className="text-[10px] font-bold text-slate-400 uppercase block">{k.label}</span>
                      <span className={`text-lg font-black ${k.col}`}>{k.val}</span>
                    </div>
                  ))}
                </div>

                {/* Status Bar */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 space-y-4">
                  <h3 className="font-bold text-sm text-slate-800">Booking Status Breakdown</h3>
                  <div className="space-y-2">
                    {(adminCharts?.bookings_by_status || [
                      { name: 'Confirmed', value: 2, color: '#10B981' },
                      { name: 'Completed', value: 1, color: '#3B82F6' },
                      { name: 'Cancelled', value: 1, color: '#EF4444' }
                    ]).map((s, idx) => (
                      <div key={idx} className="space-y-1 text-xs">
                        <div className="flex justify-between font-bold"><span>{s.name}</span><span>{s.value} Bookings</span></div>
                        <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                          <div className="h-full rounded-full" style={{ width: `${(s.value / 4) * 100}%`, backgroundColor: s.color }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 9: LOGIN */}
            {view === 'login' && (
              <div className="max-w-md mx-auto px-4 py-16">
                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-5">
                  <h1 className="text-2xl font-black text-slate-900 text-center">Sign In</h1>
                  <form onSubmit={handleLogin} className="space-y-3 text-xs">
                    <div>
                      <label className="font-bold block mb-1">Email</label>
                      <input type="email" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl" required />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Password</label>
                      <input type="password" value={loginPass} onChange={e => setLoginPass(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl" required />
                    </div>
                    <button type="submit" disabled={loading} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm">
                      {loading ? 'Authenticating...' : 'Sign In'}
                    </button>
                  </form>
                  <div className="grid grid-cols-2 gap-2 pt-2 border-t text-[11px]">
                    <button type="button" onClick={() => { setLoginEmail('admin@stayease.com'); setLoginPass('Admin@123'); }} className="p-2 bg-amber-50 text-amber-800 border border-amber-200 rounded-lg font-bold">Admin Demo</button>
                    <button type="button" onClick={() => { setLoginEmail('john@example.com'); setLoginPass('User@123'); }} className="p-2 bg-blue-50 text-blue-800 border border-blue-200 rounded-lg font-bold">User Demo</button>
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 10: REGISTER */}
            {view === 'register' && (
              <div className="max-w-md mx-auto px-4 py-16">
                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-5">
                  <h1 className="text-2xl font-black text-slate-900 text-center">Register Account</h1>
                  <form onSubmit={handleRegister} className="space-y-3 text-xs">
                    <div>
                      <label className="font-bold block mb-1">Full Name</label>
                      <input type="text" value={regName} onChange={e => setRegName(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl" required />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Email</label>
                      <input type="email" value={regEmail} onChange={e => setRegEmail(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl" required />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Phone</label>
                      <input type="tel" value={regPhone} onChange={e => setRegPhone(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl" required />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Password</label>
                      <input type="password" value={regPass} onChange={e => setRegPass(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl" required />
                    </div>
                    <button type="submit" disabled={loading} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm">
                      {loading ? 'Registering...' : 'Register'}
                    </button>
                  </form>
                </div>
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-8 border-t border-slate-800 mt-auto">
            <div className="max-w-7xl mx-auto px-4 text-center space-y-2">
              <p className="font-bold text-white">StayEase — Infrastructure Automation for Hotel Booking System</p>
              <p>Terraform • Ansible • Docker • AWS ALB • Auto Scaling • Prometheus • Grafana</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
